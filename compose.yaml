services:

  postgres:
    image: postgres:18.6
    ports:
      - "5432:5432" # What port does the software want to run on?
    volumes:
      - postgresdata:/var/lib/postgresql/18/docker  # Where is the data in the container?
    env_file:
      - .env # What needs to be given to the container for secret credentials/passwords/configurations? (Environmental variables)
    networks:
      - dbnetwork

#Docker volume: docker will choose some folder, somewhere on your computer.
#It will have a deep, complicated file address.
#BUT - you will never type in that path, because Docker uses an alias instead.
#You can store data and files here, so that they are not destroyed when the container closes.


volumes:
  postgresdata:

networks:
  dbnetwork: